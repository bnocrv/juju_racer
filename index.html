<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#13091f">
    <meta name="description" content="Juju Racer: ajude Juliana e Heloísa a chegarem na escola em um endless runner de moto.">
    <title>Juju Racer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/generated/juju-avatar-v4.png">
    <link rel="apple-touch-icon" href="assets/generated/juju-app-icon.png">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="800" height="400" aria-label="Juju Racer demo jogavel"></canvas>
      <div class="mobile-controls" aria-hidden="true">
        <button data-action="jump">Pular</button>
        <button data-action="boost">Turbo</button>
      </div>
    </main>
    <script src="src/game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
